name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ruff-action installs and caches the pinned ruff binary.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e ".[dev]"
      - run: pytest -q
