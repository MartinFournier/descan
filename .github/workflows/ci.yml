name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ruff-action installs and caches the pinned ruff binary.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
          args: format --check
