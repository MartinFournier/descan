[project]
name = "descan"
version = "0.1.0"
description = "Split, orient, and tidy the individual photos out of flatbed scans."
requires-python = ">=3.12"
dependencies = ["opencv-python>=5", "numpy"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
