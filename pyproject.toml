[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descan"
version = "0.1.0"
description = "Split, orient, and tidy the individual photos out of flatbed scans."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["opencv-python>=5", "numpy", "tqdm"]

[project.optional-dependencies]
dev = ["ruff==0.16.3", "pytest==8.4.2", "mypy==2.3.0"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[project.scripts]
descan = "descan.cli:main"
descan-split = "descan.ingest:main"
descan-trim = "descan.autocrop_review:main"
descan-crop = "descan.manualcrop:main"
descan-rename = "descan.rename_photos:main"
descan-montage = "descan.montage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
descan = ["assets/*.onnx"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
